name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Android APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace || gradle assembleDebug --stacktrace

      - name: Find and Rename APK
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_PATH"
          cp "$APK_PATH" 404NotFound_Entry_Logbook.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 404NotFound_Entry_Logbook_APK
          path: 404NotFound_Entry_Logbook.apk

      - name: Update GitHub Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v2.4.0
          files: 404NotFound_Entry_Logbook.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
